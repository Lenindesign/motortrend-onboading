<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />
    <title>Rate Your Car — MotorTrend</title>

    <!--[if mso]>
      <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
    <![endif]-->

    <style>
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; display: block; }
      body { margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #141416 !important; }
      /* Gradient hero; inlined again on body + .hero-wrap for clients that need it. */
      .hero-wrap {
        background-color: #141416 !important;
        background-repeat: no-repeat !important;
      }
      a { text-decoration: none; }
      .vehicle-photo {
        height: 280px !important;
        object-fit: cover !important;
        object-position: center !important;
        border-radius: 10px !important;
      }

      @media screen and (max-width: 620px) {
        .container { width: 100% !important; }
        .px { padding-left: 20px !important; padding-right: 20px !important; }
        .h1 { font-size: 32px !important; line-height: 1.1 !important; }
        .vehicle-photo {
          width: 100% !important;
          height: 220px !important;
          object-fit: cover !important;
          object-position: center !important;
          border-radius: 10px !important;
        }
        .star { width: 44px !important; height: 44px !important; }
        .cta { display: block !important; width: 100% !important; box-sizing: border-box !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#141416; font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    background-image: radial-gradient(circle at 18% 10%, rgba(233, 12, 23, 0.42) 0%, rgba(233, 12, 23, 0) 28%), linear-gradient(110deg, rgba(5, 5, 8, 0.98) 0%, rgba(12, 13, 18, 0.76) 45%, rgba(5, 5, 8, 0.94) 100%), linear-gradient(180deg, rgba(5, 5, 8, 0.72) 0%, rgba(5, 5, 8, 0.38) 42%, rgba(5, 5, 8, 0.96) 100%);
    background-size: 1200px 760px, cover, cover;
    background-position: left top, center, center;
    background-repeat: no-repeat;">

    <div style="display:none; overflow:hidden; line-height:1px; opacity:0; max-height:0; max-width:0;">
      30 seconds. Tap a star for your {{vehicleName}}.
    </div>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#141416;">
      <tr>
        <td class="hero-wrap" align="center" bgcolor="#141416" style="padding: 40px 16px; background-color:#141416;
          background-image: radial-gradient(circle at 18% 10%, rgba(233, 12, 23, 0.42) 0%, rgba(233, 12, 23, 0) 28%), linear-gradient(110deg, rgba(5, 5, 8, 0.98) 0%, rgba(12, 13, 18, 0.76) 45%, rgba(5, 5, 8, 0.94) 100%), linear-gradient(180deg, rgba(5, 5, 8, 0.72) 0%, rgba(5, 5, 8, 0.38) 42%, rgba(5, 5, 8, 0.96) 100%);
          background-size: 1200px 760px, cover, cover;
          background-position: left top, center, center;
          background-repeat: no-repeat;">

          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="container" style="width:600px; max-width:600px;">

            <tr>
              <td align="center" style="padding: 0 16px 28px;">
                <img src="{{rateYourCarLogoUrl}}" width="360" alt="Rate Your Car"
                     style="width:100%; max-width:360px; height:auto; display:block; margin:0 auto;" />
              </td>
            </tr>

            <tr>
              <td class="px" align="center" style="padding: 0 24px 8px;">
                <h1 class="h1" style="margin:0 0 14px; color:#ffffff;
                       font-family:'Poppins','Geist',Arial,sans-serif;
                       font-size:44px; font-weight:700; line-height:1.08; letter-spacing:-0.5px;">
                  How's your<br/>
                  <span style="font-style:italic;">{{vehicleName}}</span>,<br/>
                  {{firstName}}?
                </h1>
              </td>
            </tr>

            <tr>
              <td align="center" class="px" style="padding: 32px 0 8px;">
                <a href="{{ratingUrl}}" target="_blank">
                  <img class="vehicle-photo" src="{{vehicleImageUrl}}" alt="{{vehicleName}}" width="600" height="280"
                       style="width:100%; max-width:600px; height:280px; object-fit:cover; object-position:center; display:block; margin:0 auto; border-radius:10px;" />
                </a>
              </td>
            </tr>

            <tr>
              <td align="center" class="px" style="padding: 28px 24px 8px;">
                <p style="margin:0 auto; max-width:540px; color:#ffffff; font-size:20px; font-weight:500; line-height:1.5;
                          font-family:'Geist',Arial,sans-serif;">
                  Your honest opinion helps thousands of shoppers make confident decisions
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" class="px" style="padding: 24px 24px 48px;">
                <!--[if mso]>
                  <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                               href="{{ratingUrl}}" style="height:52px;v-text-anchor:middle;width:260px;"
                               arcsize="20%" stroke="f" fillcolor="#E90C17">
                    <w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;">RATE THIS CAR</center>
                  </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-- -->
                <a href="{{ratingUrl}}" target="_blank" class="cta"
                   style="background-color:#E90C17; color:#ffffff;
                          display:inline-block; padding:16px 40px; border-radius:8px;
                          font-family:'Poppins',Arial,sans-serif; font-size:15px; font-weight:700;
                          text-transform:uppercase; letter-spacing:1px;">
                  Rate This Car →
                </a>
                <!--<![endif]-->
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
