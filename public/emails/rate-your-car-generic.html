<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />
    <title>Rate the car you drive — MotorTrend</title>

    <!--[if mso]>
      <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
    <![endif]-->

    <style>
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; display: block; }
      body { margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #141416 !important; }
      /* Gradient hero; inlined again on body + .hero-wrap for clients that need it. */
      .hero-wrap {
        background-color: #141416 !important;
        background-repeat: no-repeat !important;
      }
      a { text-decoration: none; }

      /* Uniform trio height; object-fit crops — supported in Apple Mail, Gmail, most webmail. */
      .vehicle-trio-photo {
        height: 136px !important;
        object-fit: cover !important;
        object-position: center !important;
        border-radius: 10px !important;
      }
      /* Same outer slot as other trio cells; SUV image is scaled up inside the clip. */
      .vehicle-trio-slot-suv {
        width: 100% !important;
        max-width: 197px !important;
        height: 136px !important;
        overflow: hidden !important;
        border-radius: 10px !important;
        margin: 0 auto !important;
      }
      .vehicle-trio-photo.vehicle-trio-photo-suv {
        border-radius: 0 !important;
        transform: scale(1.16) !important;
        transform-origin: center center !important;
      }
      /* Same look as hero headline, stepped down so it does not compete with .h1 */
      .what-drive-line {
        margin: 0 !important;
        color: #ffffff !important;
        font-family: 'Poppins', 'Geist', Arial, sans-serif !important;
        font-size: 32px !important;
        font-weight: 700 !important;
        line-height: 1.08 !important;
        letter-spacing: -0.5px !important;
      }

      @media screen and (max-width: 620px) {
        .container { width: 100% !important; }
        .px { padding-left: 20px !important; padding-right: 20px !important; }
        .h1 { font-size: 32px !important; line-height: 1.1 !important; }
        .what-drive-line { font-size: 26px !important; line-height: 1.1 !important; }
        .cta { display: block !important; width: 100% !important; box-sizing: border-box !important; }
        .sublead { font-size: 18px !important; line-height: 1.5 !important; }
        .vehicle-trio-photo {
          width: 100% !important;
          height: 112px !important;
          object-fit: cover !important;
          object-position: center !important;
          border-radius: 10px !important;
        }
        .vehicle-trio-slot-suv {
          height: 112px !important;
        }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#141416; font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
    background-image: radial-gradient(circle at 18% 10%, rgba(233, 12, 23, 0.42) 0%, rgba(233, 12, 23, 0) 28%), linear-gradient(110deg, rgba(5, 5, 8, 0.98) 0%, rgba(12, 13, 18, 0.76) 45%, rgba(5, 5, 8, 0.94) 100%), linear-gradient(180deg, rgba(5, 5, 8, 0.72) 0%, rgba(5, 5, 8, 0.38) 42%, rgba(5, 5, 8, 0.96) 100%);
    background-size: 1200px 760px, cover, cover;
    background-position: left top, center, center;
    background-repeat: no-repeat;">

    <div style="display:none; overflow:hidden; line-height:1px; opacity:0; max-height:0; max-width:0;">
      What Do You Drive?
    </div>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#141416;">
      <tr>
        <td class="hero-wrap" align="center" bgcolor="#141416" style="padding: 40px 16px; background-color:#141416;
          background-image: radial-gradient(circle at 18% 10%, rgba(233, 12, 23, 0.42) 0%, rgba(233, 12, 23, 0) 28%), linear-gradient(110deg, rgba(5, 5, 8, 0.98) 0%, rgba(12, 13, 18, 0.76) 45%, rgba(5, 5, 8, 0.94) 100%), linear-gradient(180deg, rgba(5, 5, 8, 0.72) 0%, rgba(5, 5, 8, 0.38) 42%, rgba(5, 5, 8, 0.96) 100%);
          background-size: 1200px 760px, cover, cover;
          background-position: left top, center, center;
          background-repeat: no-repeat;">

          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="container" style="width:600px; max-width:600px;">

            <tr>
              <td align="center" style="padding: 0 16px 28px;">
                <img src="{{rateYourCarLogoUrl}}" width="360" alt="Rate Your Car"
                     style="width:100%; max-width:360px; height:auto; display:block; margin:0 auto;" />
              </td>
            </tr>

            <tr>
              <td class="px" align="center" style="padding: 0 24px 8px;">
                <h1 class="h1" style="margin:0 0 14px; color:#ffffff;
                       font-family:'Poppins','Geist',Arial,sans-serif;
                       font-size:44px; font-weight:700; line-height:1.08; letter-spacing:-0.5px;">
                  Real Users<br/>
                  <span style="font-style:italic;">Real Feedback</span>
                </h1>
                <p class="sublead" style="margin:0 auto; max-width:540px; color:#ffffff; font-size:20px; font-weight:500; line-height:1.5;
                          font-family:'Geist',Arial,sans-serif;">
                  Your honest opinion helps thousands of shoppers make confident decisions.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" class="px" style="padding: 32px 0 8px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%; max-width:600px; margin:0 auto;">
                  <tr>
                    <td width="33%" style="width:33%; padding:0 2px 0 0; vertical-align:top;">
                      <a href="{{ratingUrl}}" target="_blank">
                        <img class="vehicle-trio-photo" src="{{genericTruckImageUrl}}" alt="Truck" width="197" height="136"
                             style="width:100%; max-width:197px; height:136px; object-fit:cover; object-position:center; display:block; margin:0 auto; border-radius:10px;" />
                      </a>
                    </td>
                    <td width="34%" style="width:34%; padding:0 2px; vertical-align:top;">
                      <a href="{{ratingUrl}}" target="_blank">
                        <img class="vehicle-trio-photo" src="{{genericSedanImageUrl}}" alt="Sedan" width="197" height="136"
                             style="width:100%; max-width:197px; height:136px; object-fit:cover; object-position:center; display:block; margin:0 auto; border-radius:10px;" />
                      </a>
                    </td>
                    <td width="33%" style="width:33%; padding:0 0 0 2px; vertical-align:top;">
                      <a href="{{ratingUrl}}" target="_blank" style="display:block;">
                        <div class="vehicle-trio-slot-suv" style="width:100%; max-width:197px; height:136px; overflow:hidden; border-radius:10px; margin:0 auto;">
                          <img class="vehicle-trio-photo vehicle-trio-photo-suv" src="{{genericSuvImageUrl}}" alt="SUV" width="197" height="136"
                               style="width:100%; max-width:197px; height:136px; object-fit:cover; object-position:center; display:block; margin:0 auto; border-radius:0;" />
                        </div>
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" class="px" style="padding: 20px 24px 8px;">
                <p class="what-drive-line" style="margin:0; color:#ffffff;
                          font-family:'Poppins','Geist',Arial,sans-serif;
                          font-size:32px; font-weight:700; line-height:1.08; letter-spacing:-0.5px;">
                  What Do You Drive?
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" class="px" style="padding: 24px 24px 48px;">
                <!--[if mso]>
                  <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                               href="{{ratingUrl}}" style="height:52px;v-text-anchor:middle;width:240px;"
                               arcsize="20%" stroke="f" fillcolor="#E90C17">
                    <w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;">RATE NOW!</center>
                  </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-- -->
                <a href="{{ratingUrl}}" target="_blank" class="cta"
                   style="background-color:#E90C17; color:#ffffff;
                          display:inline-block; padding:16px 40px; border-radius:8px;
                          font-family:'Poppins',Arial,sans-serif; font-size:15px; font-weight:700;
                          text-transform:uppercase; letter-spacing:1px;">
                  RATE NOW!
                </a>
                <!--<![endif]-->
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 32px 24px 8px; border-top:1px solid rgba(255,255,255,0.08);">
                <p style="margin:0; color:#6E7481; font-size:12px; line-height:1.6;
                          font-family:'Geist',Arial,sans-serif;">
                  <a href="{{unsubscribeUrl}}" style="color:#B1B5C3; text-decoration:underline;">Unsubscribe</a>
                  &nbsp;·&nbsp;
                  <a href="https://www.motortrend.com/preferences" style="color:#B1B5C3; text-decoration:underline;">Email preferences</a>
                </p>
                <p style="margin:12px 0 0; color:#4B5060; font-size:11px;
                          font-family:'Geist',Arial,sans-serif;">
                  © MotorTrend
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
