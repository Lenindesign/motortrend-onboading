[build]
  command = "npm run build && STORYBOOK_BASE_PATH=/storybook/ npm run build-storybook && mkdir -p dist/storybook && cp -R storybook-static/. dist/storybook/"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/motortrend-news"
  to = "/.netlify/functions/motortrend-news"
  status = 200
  force = true

[[redirects]]
  from = "/api/motortrend-article"
  to = "/.netlify/functions/motortrend-news"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
