[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/motortrend-news"
  to = "/.netlify/functions/motortrend-news"
  status = 200
  force = true

[[redirects]]
  from = "/api/motortrend-article"
  to = "/.netlify/functions/motortrend-news"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
